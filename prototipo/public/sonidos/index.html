<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparación de sonidos de Gala</title>
<style>
  body { margin: 0; padding: 2rem 1rem 4rem; background: radial-gradient(ellipse at 50% 0, #2a1f45, #0c0814 70%) fixed; color: #efe6d2; font: 18px/1.5 Georgia, serif; }
  main { max-width: 980px; margin: auto; }
  h1 { font-weight: normal; color: #d9b45a; letter-spacing: .04em; margin: 0 0 .25rem; }
  h2 { font-weight: normal; color: #d9b45a; margin: 2rem 0 .5rem; font-size: 1.15rem; }
  p { margin: .25rem 0 1rem; color: #bfb4a0; }
  button { font: inherit; font-size: .9rem; color: #efe6d2; background: #1c1430; border: 1px solid #6b5a2c; border-radius: 4px; padding: .45rem .7rem; margin: .15rem; cursor: pointer; }
  button:hover { border-color: #d9b45a; }
  button.activo { background: #d9b45a; color: #1c1430; }
  label { margin-right: 1rem; }
  .fila { display: grid; grid-template-columns: 7rem 1fr 2fr; gap: .75rem; padding: .75rem 0; border-top: 1px solid #3a2e55; align-items: start; }
  .fila b { color: #d9b45a; font-weight: normal; }
  .cabecera { color: #bfb4a0; font-size: .85rem; border: 0; padding-bottom: 0; }
  small { display: block; color: #8d8370; }
  @media (max-width: 640px) { .fila { grid-template-columns: 1fr; } .cabecera { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Sonidos de Gala</h1>
  <p>Toca un botón para oírlo. El botón dorado de cada fila es el que usa «Oír una Partida».</p>

  <label><input type="checkbox" id="sala" checked> Añadir sala a los archivos</label>
  <label>Volumen <input type="range" id="volumen" min="0" max="1" step="0.05" value="0.8"></label>

  <div class="fila cabecera"><span>Evento</span><span>Sintetizado</span><span>Archivos CC0 (Kenney)</span></div>
  <div id="filas"></div>

  <h2>Oír una Partida</h2>
  <p>Encadena mover, mover, capturar, jaque y fin de Partida con el ritmo de las animaciones de Gala.</p>
  <button id="secuencia-sintesis">Toda sintetizada</button>
  <button id="secuencia-archivos">Toda con archivos</button>
  <button id="secuencia-marcada">Con lo marcado en cada fila</button>
</main>

<script>
const EVENTOS = [
  { id: 'mover', nombre: 'Mover', archivos: ['chip-lay-1', 'chips-collide-1', 'bookPlace1'] },
  { id: 'capturar', nombre: 'Capturar', archivos: ['metalLatch', 'drawKnife1', 'handleCoins'] },
  { id: 'jaque', nombre: 'Jaque', archivos: ['metalPot1', 'bong_001', 'jingles_HIT00', 'jingles_STEEL00'] },
  { id: 'fin', nombre: 'Fin de Partida', archivos: ['jingles_STEEL03', 'jingles_PIZZA03', 'jingles_SAX03'] },
];

let ctx, maestro, sala;
const buffers = {};
const marcado = Object.fromEntries(EVENTOS.map((e) => [e.id, 'sintesis']));

function iniciar() {
  if (ctx) return ctx.resume();
  ctx = new AudioContext();
  maestro = ctx.createGain();
  maestro.gain.value = document.getElementById('volumen').value;
  maestro.connect(ctx.destination);
  sala = ctx.createConvolver();
  sala.buffer = respuestaDeSala(2.6);
  const regreso = ctx.createGain();
  regreso.gain.value = 0.35;
  sala.connect(regreso).connect(maestro);
  return ctx.resume();
}

function respuestaDeSala(segundos) {
  const largo = Math.floor(ctx.sampleRate * segundos);
  const ir = ctx.createBuffer(2, largo, ctx.sampleRate);
  for (let canal = 0; canal < 2; canal++) {
    const datos = ir.getChannelData(canal);
    let filtro = 0;
    for (let i = 0; i < largo; i++) {
      filtro += 0.25 * (Math.random() * 2 - 1 - filtro);
      datos[i] = filtro * Math.pow(1 - i / largo, 3.2);
    }
  }
  return ir;
}

function destino(conSala = true) {
  const entrada = ctx.createGain();
  entrada.connect(maestro);
  if (conSala) entrada.connect(sala);
  return entrada;
}

function golpe(t, frecuencia, duracion, volumen, salida) {
  const osc = ctx.createOscillator();
  const env = ctx.createGain();
  osc.frequency.setValueAtTime(frecuencia * 1.8, t);
  osc.frequency.exponentialRampToValueAtTime(frecuencia, t + 0.04);
  env.gain.setValueAtTime(volumen, t);
  env.gain.exponentialRampToValueAtTime(0.001, t + duracion);
  osc.connect(env).connect(salida);
  osc.start(t);
  osc.stop(t + duracion);

  const ruido = ctx.createBufferSource();
  const datos = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.03), ctx.sampleRate);
  datos.getChannelData(0).forEach((_, i, a) => { a[i] = Math.random() * 2 - 1; });
  ruido.buffer = datos;
  const paso = ctx.createBiquadFilter();
  paso.type = 'lowpass';
  paso.frequency.value = 1100;
  const envRuido = ctx.createGain();
  envRuido.gain.setValueAtTime(volumen * 0.6, t);
  envRuido.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
  ruido.connect(paso).connect(envRuido).connect(salida);
  ruido.start(t);
}

function campana(t, frecuencia, duracion, volumen, salida) {
  [[1, 1], [2, 0.5], [2.76, 0.3], [5.4, 0.12]].forEach(([parcial, peso]) => {
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.frequency.value = frecuencia * parcial;
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(volumen * peso, t + 0.012);
    env.gain.exponentialRampToValueAtTime(0.0001, t + duracion / parcial);
    osc.connect(env).connect(salida);
    osc.start(t);
    osc.stop(t + duracion / parcial);
  });
}

const SINTESIS = {
  mover(t) {
    golpe(t, 135, 0.22, 0.9, destino());
  },
  capturar(t) {
    const salida = destino();
    golpe(t, 95, 0.32, 1, salida);
    [2093, 2794, 3136, 2349, 3520, 2637].forEach((f, i) => campana(t + 0.08 + i * 0.07, f, 0.5, 0.05, salida));
  },
  jaque(t) {
    const salida = destino();
    golpe(t, 80, 0.4, 0.6, salida);
    campana(t, 146.83, 2, 0.28, salida);
    campana(t + 0.02, 207.65, 2, 0.22, salida);
  },
  fin(t) {
    const salida = destino();
    golpe(t, 60, 0.8, 1, salida);
    [73.42, 146.83, 220, 293.66, 369.99].forEach((f, i) => campana(t + 0.25 + i * 0.22, f, 3.2, 0.26, salida));
  },
};

async function cargar(nombre) {
  if (!buffers[nombre]) {
    const respuesta = await fetch(`archivos/${nombre}.ogg`);
    buffers[nombre] = await ctx.decodeAudioData(await respuesta.arrayBuffer());
  }
  return buffers[nombre];
}

async function sonarArchivo(nombre, t = ctx.currentTime) {
  const fuente = ctx.createBufferSource();
  fuente.buffer = await cargar(nombre);
  fuente.connect(destino(document.getElementById('sala').checked));
  fuente.start(t);
}

async function sonar(evento, opcion, t) {
  await iniciar();
  if (opcion === 'sintesis') SINTESIS[evento](t ?? ctx.currentTime);
  else await sonarArchivo(opcion, t ?? ctx.currentTime);
}

function marcar(evento, opcion) {
  marcado[evento] = opcion;
  document.querySelectorAll(`[data-evento="${evento}"]`).forEach((b) => b.classList.toggle('activo', b.dataset.opcion === opcion));
}

function boton(evento, opcion, texto) {
  const b = document.createElement('button');
  b.textContent = texto;
  b.dataset.evento = evento;
  b.dataset.opcion = opcion;
  b.onclick = () => { marcar(evento, opcion); sonar(evento, opcion); };
  return b;
}

const filas = document.getElementById('filas');
for (const e of EVENTOS) {
  const fila = document.createElement('div');
  fila.className = 'fila';
  const titulo = document.createElement('b');
  titulo.textContent = e.nombre;
  const sintesis = document.createElement('div');
  sintesis.append(boton(e.id, 'sintesis', 'Gala'));
  const archivos = document.createElement('div');
  e.archivos.forEach((a) => archivos.append(boton(e.id, a, a)));
  fila.append(titulo, sintesis, archivos);
  filas.append(fila);
  marcar(e.id, 'sintesis');
}

const RITMO = [['mover', 0], ['mover', 1.6], ['capturar', 3.2], ['jaque', 5], ['fin', 8]];

async function oirPartida(elegir) {
  await iniciar();
  const inicio = ctx.currentTime + 0.1;
  for (const [evento, retraso] of RITMO) await sonar(evento, elegir(evento), inicio + retraso);
}

document.getElementById('secuencia-sintesis').onclick = () => oirPartida(() => 'sintesis');
document.getElementById('secuencia-archivos').onclick = () => oirPartida((evento) => EVENTOS.find((e) => e.id === evento).archivos[0]);
document.getElementById('secuencia-marcada').onclick = () => oirPartida((evento) => marcado[evento]);
document.getElementById('volumen').oninput = (ev) => { if (maestro) maestro.gain.value = ev.target.value; };
</script>
</body>
</html>
